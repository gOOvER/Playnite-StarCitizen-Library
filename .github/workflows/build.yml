name: CI Build & Package

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Package (.pext)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore StarCitizenLibrary.csproj

    - name: Build Project (Release)
      run: dotnet build StarCitizenLibrary.csproj -c Release --no-restore -p:DebugType=none -p:DebugSymbols=false

    - name: Package Playnite Extension (.pext)
      id: package
      shell: pwsh
      run: |
        $outDir = "bin/Release/net462"
        if (-not (Test-Path $outDir)) {
          Write-Error "Build output directory not found: $outDir"
          exit 1
        }

        # Read addon ID and version from extension.yaml
        $yamlContent = Get-Content (Join-Path $outDir "extension.yaml") -Raw
        $version = if ($yamlContent -match '(?m)^Version:\s*([^\r\n]+)') { $Matches[1].Trim() } else { "0.1.0" }

        $pextName = "StarCitizenLibrary_v${version}.pext"
        $pextPath = Join-Path "bin" $pextName

        Write-Host "Creating extension package: $pextName"
        Compress-Archive -Path "$outDir\*" -DestinationPath $pextPath -Force

        echo "pext_name=$pextName" >> $env:GITHUB_OUTPUT
        echo "pext_path=$pextPath" >> $env:GITHUB_OUTPUT

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.package.outputs.pext_name }}
        path: ${{ steps.package.outputs.pext_path }}
        if-no-files-found: error
