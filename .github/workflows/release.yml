name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.1.0 or v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Publish as draft'
        type: boolean
        required: false
        default: false
      is_prerelease:
        description: 'Mark as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore StarCitizenLibrary.csproj

    - name: Build Project (Release)
      run: dotnet build StarCitizenLibrary.csproj -c Release --no-restore -p:DebugType=none -p:DebugSymbols=false

    - name: Package Playnite Extension (.pext)
      id: package
      shell: pwsh
      run: |
        $outDir = "bin/Release/net462"
        if (-not (Test-Path $outDir)) {
          Write-Error "Build output directory not found: $outDir"
          exit 1
        }

        # Resolve tag and version
        $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.tag_name }}" }
        $cleanVer = $tag.TrimStart('v')

        # Read addon ID from extension.yaml
        $yamlContent = Get-Content (Join-Path $outDir "extension.yaml") -Raw
        $addonId = if ($yamlContent -match '(?m)^Id:\s*([^\r\n]+)') { $Matches[1].Trim() } else { "StarCitizenLibrary_d2146b15-4cfc-40cc-93dd-1297e2e0aa49" }
        $versionTag = $cleanVer -replace '\.', '_'

        $pextName = "${addonId}_${versionTag}.pext"
        $pextPath = Join-Path "bin" $pextName

        Write-Host "Creating release package: $pextName"
        Compress-Archive -Path "$outDir\*" -DestinationPath $pextPath -Force

        # Calculate SHA256
        $hash = (Get-FileHash $pextPath -Algorithm SHA256).Hash
        $checksumContent = "$hash  $pextName"
        $checksumPath = "bin/SHA256SUMS.txt"
        Set-Content -Path $checksumPath -Value $checksumContent -Encoding UTF8

        echo "pext_name=$pextName" >> $env:GITHUB_OUTPUT
        echo "pext_path=$pextPath" >> $env:GITHUB_OUTPUT
        echo "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT
        echo "sha256=$hash" >> $env:GITHUB_OUTPUT
        echo "clean_version=$cleanVer" >> $env:GITHUB_OUTPUT
        echo "release_tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Extract Release Notes from CHANGELOG
      id: extract_notes
      shell: pwsh
      run: |
        $ver = "${{ steps.package.outputs.clean_version }}"
        $tag = "${{ steps.package.outputs.release_tag }}"
        $hash = "${{ steps.package.outputs.sha256 }}"
        $pextName = "${{ steps.package.outputs.pext_name }}"

        $notes = ""
        if (Test-Path "CHANGELOG.md") {
          $cl = Get-Content "CHANGELOG.md" -Raw
          $verPat = "(?ms)^## \[$([regex]::Escape($ver))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          if ($cl -match $verPat) {
            $notes = $Matches[1].Trim()
          }
        }

        if ([string]::IsNullOrWhiteSpace($notes)) {
          $notes = "Release $tag of Roberts Space Industries Playnite Library Plugin."
        }

        $notes += "`r`n`r`n---`r`n### 🛡️ Package Integrity`r`n"
        $notes += "- **File:** `$pextName``r`n"
        $notes += "- **SHA-256:** ``$hash```r`n"
        $notes += "`r`n---`r`n📋 **Full Changelog:** https://github.com/gOOvER/Playnite-StarCitizen-Library/blob/main/CHANGELOG.md"

        Set-Content -Path "bin/RELEASE_NOTES.md" -Value $notes -Encoding UTF8

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Star Citizen Library ${{ steps.package.outputs.release_tag }}
        tag_name: ${{ steps.package.outputs.release_tag }}
        body_path: bin/RELEASE_NOTES.md
        draft: ${{ inputs.draft == true || github.event.inputs.draft == 'true' }}
        prerelease: ${{ inputs.is_prerelease == true || github.event.inputs.is_prerelease == 'true' || contains(steps.package.outputs.release_tag, '-beta') || contains(steps.package.outputs.release_tag, '-rc') || contains(steps.package.outputs.release_tag, '-alpha') }}
        files: |
          ${{ steps.package.outputs.pext_path }}
          ${{ steps.package.outputs.checksum_path }}
